name: DORA metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  dora:
    runs-on: ubuntu-latest
    steps:
      - name: Compute and report DORA metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import datetime as dt
          import json
          import os
          import statistics
          import subprocess
          from collections import defaultdict

          repo = os.environ["GITHUB_REPOSITORY"]

          def gh(*args):
              return subprocess.check_output(["gh", *args], text=True)

          def t(s):
              return dt.datetime.fromisoformat(s.replace("Z", "+00:00"))

          runs = json.loads(gh(
              "run", "list", "--repo", repo,
              "--workflow", "CI", "--branch", "main", "--event", "push",
              "--limit", "100",
              "--json", "conclusion,headSha,createdAt,updatedAt"))

          prs = json.loads(gh(
              "pr", "list", "--repo", repo,
              "--state", "merged", "--limit", "50",
              "--json", "number,mergedAt,mergeCommit"))

          weeks = defaultdict(lambda: {"ok": 0, "fail": 0, "lead": []})
          ok_by_sha = {}

          for r in runs:
              wk = t(r["createdAt"]).strftime("%G-W%V")
              if r["conclusion"] == "success":
                  weeks[wk]["ok"] += 1
                  ok_by_sha[r["headSha"]] = t(r["updatedAt"])
              elif r["conclusion"] == "failure":
                  weeks[wk]["fail"] += 1

          for pr in prs:
              sha = (pr.get("mergeCommit") or {}).get("oid")
              if sha not in ok_by_sha:
                  continue
              try:
                  out = gh(
                      "api", f"repos/{repo}/pulls/{pr['number']}/commits",
                      "--paginate", "--jq", ".[].commit.author.date")
                  dates = [t(line) for line in out.split() if line]
              except subprocess.CalledProcessError:
                  continue
              if not dates:
                  continue
              first_commit = min(dates)
              wk = t(pr["mergedAt"]).strftime("%G-W%V")
              hours = (ok_by_sha[sha] - first_commit).total_seconds() / 3600
              weeks[wk]["lead"].append(hours)

          lines = [
              "| Week | Successful deploys | Failed | Change failure rate | Median lead time (h) |",
              "|---|---|---|---|---|",
          ]
          for wk in sorted(weeks):
              w = weeks[wk]
              total = w["ok"] + w["fail"]
              cfr = f"{100 * w['fail'] / total:.0f}%" if total else "-"
              lead = f"{statistics.median(w['lead']):.1f}" if w["lead"] else "-"
              lines.append(f"| {wk} | {w['ok']} | {w['fail']} | {cfr} | {lead} |")

          report = "\n".join(lines)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## DORA metrics\n\n" + report + "\n")
          EOF